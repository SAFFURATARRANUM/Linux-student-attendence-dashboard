<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Monitoring Dashboard - Linux</title>
    <!-- Link to your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Student Attendance Monitoring Dashboard</h1>
            <p>Linux programming practical dashboard</p>
        </header>

        <!-- Main Content Area -->
        <main class="dashboard-main">
            <div class="overview-header">
                <div>
                    <h2>Dashboard Overview</h2>
                    <p class="timestamp">Last refreshed: 12:28:51 am</p> <!-- Static for now -->
                </div>
                <button class="refresh-btn" onclick="loadCSVData()">↻ Refresh Data</button>
            </div>

            <!-- KPI Cards -->
            <section class="kpi-cards">
                  <div class="card">
                    <h3>Total Students</h3>
                    <p id="kpi-total">10</p>
                </div>
                <div class="card">
                    <h3>Average Attendance</h3>
                    <p id="kpi-avg">77.8%</p>
                </div>
                <div class="card">
                    <h3>Eligible</h3>
                    <p id="kpi-eligible">6</p>
                </div>
                <div class="card">
                    <h3>Below 75%</h3>
                    <p id="kpi-below">4</p>
                </div>
            </section>

            <!-- Bottom Section: Chart and Table -->
            <section class="data-section">
                <!-- Chart Container -->
                <div class="chart-container">
                    <h3>Summary Visualization</h3>
                    <!-- This box will hold the Chart.js canvas later -->
                    <div class="canvas-wrapper">
                    <canvas id="attendanceChart"></canvas>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="table-container">
                    <h3>Detailed Records</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Student_ID</th>
                                <th>Student_Name</th>
                                <th>Attendance_%</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                          <!-- JavaScript will fill this in --> 
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>

</html>
